<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>RunMetrics Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
</head>
<body>
  <header>
    <h1>🏃 RunMetrics</h1>
    <p class="sub">Weekly progress + CTL/ATL/TSB (Form)</p>
    <p class="small">Data source: your own Strava via your backend.</p>
  </header>

  <section class="card">
    <h2>Weekly distance vs goal</h2>
    <div id="weekly_plot" class="plot"></div>
    <div id="weekly_meta" class="small"></div>
  </section>

  <section class="card">
    <h2>Fitness / fatigue / form</h2>
    <div id="load_plot" class="plot"></div>
    <div id="load_meta" class="small"></div>
  </section>

  <section class="card">
    <h2>Recent activities</h2>
    <table id="recent">
      <thead>
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Type</th>
          <th>km</th>
          <th>min/km</th>
          <th>Avg HR</th>
          <th>EF</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <footer class="small">
    <p><strong>Outstanding task:</strong> migrate database off Render free Postgres before the 30‑day expiry.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
