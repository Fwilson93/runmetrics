<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RunMetrics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🏃 RunMetrics</h1>
  <p class="subtitle">Your Strava data, your metrics.</p>

  <section>
    <h2>Recent Activities</h2>
    <table id="activities">
      <thead>
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Distance (km)</th>
          <th>Pace (min/km)</th>
          <th>Avg HR</th>
          <th>EF</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Efficiency Factor</h2>
    <div id="ef_plot"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
