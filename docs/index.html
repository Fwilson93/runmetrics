<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RunMetrics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🏃 RunMetrics</h1>
    <p class="subtitle">Your Strava data, your metrics.</p>
    <div class="controls">
      <button id="recompute">Recompute metrics</button>
      <span id="status" class="status">Ready</span>
    </div>
  </header>

  <section>
    <h2>Efficiency Factor (EF) over time</h2>
    <div id="ef_plot" class="plot"></div>
  </section>

  <section>
    <h2>Recent Activities</h2>
    <div class="table-wrap">
      <table id="activities">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>km</th>
            <th>Pace</th>
            <th>Avg HR</th>
            <th>EF</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
