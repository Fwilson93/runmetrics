<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RunMetrics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>🏃 RunMetrics</h1>
      <p class="subtitle">Your Strava data, your metrics.</p>
    </div>
    <div class="controls">
      <button id="recompute">Recompute metrics</button>
      <button id="recompute_pmc">Recompute PMC</button>
      <span id="status" class="status">Ready</span>
    </div>
  </header>

  <section class="cards" aria-label="TrainingPeaks-style status">
    <div class="card">
      <div class="kicker">Fitness</div>
      <div class="value" id="ctl_val">–</div>
      <div class="delta" id="ctl_delta">–</div>
    </div>
    <div class="card">
      <div class="kicker">Fatigue</div>
      <div class="value" id="atl_val">–</div>
      <div class="delta" id="atl_delta">–</div>
    </div>
    <div class="card">
      <div class="kicker">Form</div>
      <div class="value" id="tsb_val">–</div>
      <div class="delta" id="tsb_delta">–</div>
    </div>
  </section>

  <section>
    <h2>Performance Management Chart (PMC)</h2>
    <div id="pmc_plot" class="plot"></div>
  </section>

  <section>
    <h2>Efficiency Factor (EF) over time</h2>
    <div id="ef_plot" class="plot"></div>
  </section>

  <section>
    <h2>Recent Activities</h2>
    <div class="table-wrap">
      <table id="activities">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>km</th>
            <th>Pace (min/km)</th>
            <th>Avg HR</th>
            <th>EF</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
